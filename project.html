<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Frontend project - Дарья Перминова</title>

    <link rel="icon" type="image/png" href="logo-avatar.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f7f5f0;
        --card: #fff;
        --ink: #17191f;
        --muted: #6b7078;
        --line: #d8d0c2;
        --hover: rgb(231 227 217);
        --accent: #a32661;
        --accent-dark: #71163f;
        --shadow: 0 18px 44px rgba(36, 31, 24, 0.08);
        --container: 1120px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(90deg, rgba(23, 25, 31, 0.035) 1px, transparent 1px),
          linear-gradient(180deg, rgba(23, 25, 31, 0.035) 1px, transparent 1px),
          var(--bg);
        background-size: 28px 28px;
        font-family: "Manrope", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        animation: page-in 420ms ease-out both;
      }

      a {
        color: inherit;
      }

      .shell {
        width: min(var(--container), calc(100% - 32px));
        margin: 0 auto;
        padding: 28px 0 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 46px;
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--accent-dark);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
      }

      .back img {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        object-fit: cover;
        box-shadow: var(--shadow);
      }

      .back:hover {
        text-decoration: underline;
      }

      .project-menu {
        position: relative;
        min-width: 210px;
      }

      .project-menu__button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        color: var(--ink);
        font: inherit;
        cursor: pointer;
        box-shadow: 0 12px 30px rgba(36, 31, 24, 0.06);
        transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
      }

      .project-menu__button:hover,
      .project-menu__button[aria-expanded="true"] {
        border-color: rgba(163, 38, 97, 0.44);
        background: var(--hover);
        box-shadow: 0 16px 38px rgba(36, 31, 24, 0.1);
      }

      .project-menu__button span {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .project-menu__button strong {
        font-size: 14px;
        font-weight: 800;
      }

      .project-menu__button::after {
        content: "";
        width: 8px;
        height: 8px;
        border-right: 2px solid var(--accent-dark);
        border-bottom: 2px solid var(--accent-dark);
        transform: rotate(45deg) translateY(-2px);
        transition: transform 180ms ease;
      }

      .project-menu__button[aria-expanded="true"]::after {
        transform: rotate(225deg) translateY(-2px);
      }

      .project-menu__list {
        position: absolute;
        z-index: 10;
        top: calc(100% + 8px);
        right: 0;
        display: grid;
        gap: 4px;
        width: 100%;
        min-width: 230px;
        padding: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transform: translateY(-4px);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .project-menu_open .project-menu__list {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .project-menu__item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 38px;
        padding: 0 10px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
      }

      .project-menu__item:hover,
      .project-menu__item_active {
        background: var(--hover);
        color: var(--accent-dark);
      }

      .project-menu__item_active::after {
        content: "Выбран";
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 24px;
        align-items: end;
        padding-bottom: 28px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 800;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 50px;
        line-height: 1.02;
        letter-spacing: 0;
      }

      .summary {
        max-width: 720px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.55;
      }

      .count {
        color: var(--muted);
        font-size: 14px;
        text-align: right;
        white-space: nowrap;
      }

      .count strong {
        display: block;
        color: var(--ink);
        font-size: 36px;
        line-height: 1;
      }

      .section {
        margin-top: 34px;
      }

      .contacts {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
        justify-content: space-between;
        margin-top: 42px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }

      .contacts div {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
      }

      .contacts a {
        color: var(--accent-dark);
        font-weight: 800;
        text-decoration: none;
      }

      .contacts a:hover {
        text-decoration: underline;
      }

      .section-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 14px;
      }

      .section h2 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0;
      }

      .hint {
        color: var(--muted);
        font-size: 14px;
      }

      .stack-overview {
        display: grid;
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.25fr);
        gap: 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.34);
      }

      .stack-card,
      .stack-group {
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .stack-card {
        padding: 24px 0;
      }

      .stack-card + .stack-card {
        margin-left: 30px;
        padding-left: 30px;
        border-left: 1px solid var(--line);
      }

      .stack-card h3,
      .stack-group h3 {
        margin: 0 0 12px;
        color: var(--accent-dark);
        font-size: 15px;
      }

      .stack-card p {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .stack-list {
        display: grid;
        gap: 8px;
        margin: 14px 0 0;
        padding: 0;
        list-style: none;
      }

      .stack-list li {
        position: relative;
        padding-left: 16px;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.45;
      }

      .stack-list li::before {
        content: "";
        position: absolute;
        top: 0.7em;
        left: 0;
        width: 7px;
        height: 2px;
        background: var(--accent);
      }

      .skill-cloud {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
      }

      .skill-chip {
        display: inline-flex;
        align-items: center;
        min-height: 30px;
        padding: 5px 9px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.72);
        color: var(--ink);
        font-size: 12px;
        font-weight: 700;
      }

      .stack-groups {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 26px;
        margin-top: 28px;
      }

      .stack-group {
        padding: 16px 0 0;
        border-top: 2px solid var(--accent);
      }

      .stack-group ul {
        display: grid;
        gap: 7px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .stack-group li {
        position: relative;
        padding-left: 13px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .stack-group li::before {
        content: "·";
        position: absolute;
        left: 0;
        color: var(--accent);
        font-weight: 900;
      }

      .featured {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .featured-link {
        display: grid;
        align-content: space-between;
        min-height: 132px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        box-shadow: var(--shadow);
        text-decoration: none;
        transition: border-color 180ms ease, transform 180ms ease;
      }

      .featured-link:hover {
        transform: translateY(-2px);
        border-color: rgba(163, 38, 97, 0.45);
        background: var(--hover);
      }

      .featured-link strong {
        font-size: 20px;
        line-height: 1.2;
      }

      .featured-link span {
        color: var(--muted);
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .all-pages {
        display: grid;
        border-top: 1px solid var(--line);
      }

      .page-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: center;
        min-height: 60px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
        text-decoration: none;
        transition: color 180ms ease, padding 180ms ease, background 180ms ease;
      }

      .page-row:hover {
        color: var(--accent-dark);
        padding-right: 12px;
        padding-left: 12px;
        background: var(--hover);
      }

      .page-row strong {
        display: block;
        font-size: 15px;
      }

      .page-row small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      .page-row em {
        color: var(--muted);
        font-size: 13px;
        font-style: normal;
        font-weight: 800;
      }

      @keyframes page-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @media (max-width: 860px) {
        .topbar,
        .hero,
        .section-head {
          display: grid;
          grid-template-columns: 1fr;
        }

        .count {
          text-align: left;
        }

        .featured {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .stack-overview,
        .stack-groups {
          grid-template-columns: 1fr;
        }

        .stack-card + .stack-card {
          margin-left: 0;
          padding-left: 0;
          border-top: 1px solid var(--line);
          border-left: 0;
        }

        .stack-groups {
          gap: 18px;
        }

        .project-menu {
          width: 100%;
        }

        .project-menu__list {
          left: 0;
          right: auto;
        }

        .page-row {
          grid-template-columns: 1fr;
          gap: 5px;
        }

        h1 {
          font-size: 38px;
        }
      }

      @media (max-width: 560px) {
        .shell {
          width: min(100% - 24px, var(--container));
          padding-top: 20px;
        }

        .featured {
          grid-template-columns: 1fr;
        }

        h1 {
          font-size: 33px;
        }
      }
    </style>
  </head>

        spiceit: {

          highlights: [
            'Реализованы контентные разделы, лендинги услуг и разные варианты popup-форм.',
            'Подключены GSAP, ScrollTrigger, ScrollToPlugin, Swiper и AAT.',
            'Проработаны события, отзывы, вакансии, тендеры и адаптивная навигация.'
          ],
          tools: ['Swiper 11', 'GSAP 3.12.2', 'ScrollTrigger', 'ScrollToPlugin', 'AAT', 'DynamicAdapt'],
          libraries: ['GSAP, ScrollTrigger и ScrollToPlugin для анимаций и навигации', 'Swiper для слайдеров', 'AAT для анимаций появления', 'DynamicAdapt для адаптива'],
          scenarios: ['Услуги и кейсы', 'Блог и статьи', 'События и отзывы', 'Тендеры и вакансии', 'Попапы и формы']

      }
      const params = new URLSearchParams(window.location.search)
      const projectKey = PROJECTS[params.get('project')] ? params.get('project') : PROJECT_ORDER[0]
      const project = PROJECTS[projectKey]

      document.title = `${project.title} - project pages`
      document.querySelector('#kind').textContent = project.kind
      document.querySelector('#title').textContent = project.title
      document.querySelector('#summary').textContent = project.summary
      document.querySelector('#allCount').textContent = 'Открыть любой экран'

      const switchRoot = document.querySelector('#projectSwitch')
      const switchButton = document.querySelector('#projectSwitchButton')
      const switchList = document.querySelector('#projectSwitchList')

      renderSwitcher()
      renderSkills()
      renderAllPages()

      switchButton.addEventListener('click', () => {
        setMenuOpen(!switchRoot.classList.contains('project-menu_open'))
      })

      document.addEventListener('click', event => {
        if (!switchRoot.contains(event.target)) setMenuOpen(false)
      })

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') setMenuOpen(false)
      })

      function renderSwitcher() {
        document.querySelector('#projectSwitchLabel').textContent = project.title
        switchList.innerHTML = PROJECT_ORDER
          .map(key => {
            const item = PROJECTS[key]
            return `<button class="project-menu__item ${key === projectKey ? 'project-menu__item_active' : ''}" type="button" role="menuitem" data-project="${key}">${item.title}</button>`
          })
          .join('')

        switchList.querySelectorAll('button').forEach(button => {
          button.addEventListener('click', () => {
            const nextProject = button.dataset.project
            if (nextProject && nextProject !== projectKey) {
              window.location.href = `project.html?project=${nextProject}`
            } else {
              setMenuOpen(false)
            }
          })
        })
      }

      function setMenuOpen(isOpen) {
        switchRoot.classList.toggle('project-menu_open', isOpen)
        switchButton.setAttribute('aria-expanded', String(isOpen))
      }

      function renderAllPages() {
        document.querySelector('#allPages').innerHTML = project.pages
          .map(page => `<a class="page-row" href="${href(page)}"><span><strong>${escapeHtml(label(page))}</strong><small>${screenType(page)}</small></span><em>Открыть</em></a>`)
          .join('')
      }

      function renderSkills() {
        const skills = project.skills || defaultSkills(project)
        const toolCount = skills.tools.length

        document.querySelector('#stackCount').textContent = toolCount
        document.querySelector('#stackSummary').textContent = skills.summary
        document.querySelector('#stackHighlights').innerHTML = skills.highlights
          .map(item => `<li>${escapeHtml(item)}</li>`)
          .join('')
        document.querySelector('#skillCloud').innerHTML = skills.tools
          .map(item => `<span class="skill-chip">${escapeHtml(item)}</span>`)
          .join('')
        document.querySelector('#stackGroups').innerHTML = skills.groups
          .map(group => `
            <article class="stack-group">
              <h3>${escapeHtml(group.title)}</h3>
              <ul>${group.items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>
            </article>
          `)
          .join('')
      }

      function defaultSkills(item) {
        const detail = PROJECT_DETAILS[projectKey] || {}
        const baseTools = ['HTML5', 'CSS3', 'SCSS / Sass', 'JavaScript', 'БЭМ', 'Responsive layout', 'Adaptive layout', 'Flexbox', 'CSS Grid', 'Media queries', 'DOM API', 'CSS animations', 'SVG sprites', 'Custom fonts', 'WebP / AVIF']
        return {
          summary: detail.summary || `${item.title}: многостраничная адаптивная верстка с готовыми HTML-экранами, общей стилизацией, интерактивными элементами и статическим запуском.`,
          highlights: detail.highlights || [
            'HTML/CSS/JavaScript-верстка по готовому дизайну.',
            'Адаптивные страницы, меню, карточки, формы, списки и служебные состояния.',
            'Организация ассетов, локальных CSS/JS-файлов и ссылок между страницами.'
          ],
          tools: [...new Set([...baseTools, ...(detail.tools || [])])],
          groups: [
            {
              title: 'Frontend',
              items: ['Многостраничная HTML-структура', 'Адаптивная верстка под desktop, tablet и mobile', 'Компонентные UI-блоки и БЭМ', 'Работа с локальными ассетами, SVG и шрифтами']
            },
            {
              title: 'Библиотеки и интеграции',
              items: detail.libraries || ['Нативный DOM API', 'Интерактивные состояния на JavaScript', 'CSS transitions и animations', 'Статический запуск без backend']
            },
            {
              title: 'Интерфейсные сценарии',
              items: detail.scenarios || ['Навигация между экранами', 'Карточки и списки', 'Формы и служебные страницы', 'Интерактивные состояния на JavaScript']
            }
          ]
        }
      }

      function href(page) {
        return `projects/${projectKey}/${page}`
      }

      function label(page) {
        if (PROJECT_LABELS[projectKey]?.[page]) return PROJECT_LABELS[projectKey][page]
        if (LABELS[page]) return LABELS[page]
        return fallbackLabel(page)
      }

      function fallbackLabel(page) {
        const name = page.replace('.html', '')
        const variant = name.match(/^(.*)-(\d+)$/)
        const base = variant ? variant[1] : name
        const title = base
          .split('-')
          .map(part => {
            const dict = {
              account: 'кабинет',
              authors: 'авторы',
              author: 'автор',
              basket: 'корзина',
              blog: 'блог',
              card: 'карточка',
              catalog: 'каталог',
              collection: 'коллекция',
              contacts: 'контакты',
              details: 'детали',
              empty: 'пусто',
              event: 'событие',
              events: 'события',
              favourites: 'избранное',
              form: 'форма',
              history: 'история',
              item: 'карточка товара',
              list: 'список',
              login: 'вход',
              media: 'медиа',
              order: 'заказ',
              orders: 'заказы',
              payment: 'оплата',
              product: 'продукт',
              products: 'продукты',
              project: 'проект',
              projects: 'проекты',
              reg: 'регистрация',
              search: 'поиск',
              service: 'услуга',
              services: 'услуги',
              settings: 'настройки',
              wishlist: 'избранное',
              works: 'работы'
            }
            return dict[part] || part
          })
          .join(' ')
          .replace(/^./, char => char.toUpperCase())

        return variant ? `${title}: вариант ${variant[2]}` : title
      }

      function screenType(page) {
        const name = page.replace('.html', '')
        if (name === 'index' || name.startsWith('index-')) return 'Витрина'
        if (/(catalog|collection|products|shop|rooms|services|specials|universe|works|artists|studio|mood)/.test(name)) return 'Каталог / раздел'
        if (/(product|card|item|obj|project)/.test(name)) return 'Карточка / детальная'
        if (/(cart|basket|bag|order|payment|delivery|buy|refund|details)/.test(name)) return 'Покупка / заказ'
        if (/(account|lk|login|reg|wishlist|favourites)/.test(name)) return 'Кабинет / авторизация'
        if (/(case|blog|article|event|author|media|history|podcast|press|news|sale|review|ambassodor)/.test(name)) return 'Контент'
        if (/(form|contacts|vacancy|tender|offices|specialists)/.test(name)) return 'Форма / контакты'
        if (/(policy|privacy|text|404|error)/.test(name)) return 'Служебная'
        return 'Экран'
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char])
      }
    </script>
