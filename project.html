      const params = new URLSearchParams(window.location.search)
      const requested = params.get('project') || params.get('id')
      const projectKey = PROJECTS[requested] ? requested : PROJECT_ORDER[0]
      const project = PROJECTS[projectKey]
      const pages = PAGES[projectKey]

      document.title = `${project.title} · Дарья Перминова`
      document.querySelector('#kind').textContent = project.kind
      document.querySelector('#title').textContent = project.title
      document.querySelector('#summary').textContent = project.summary
      document.querySelector('#openSite').href = href('index.html')
      document.querySelector('#screenCount').textContent = pages.length
      document.querySelector('#screenWord').textContent = plural(pages.length, 'экран', 'экрана', 'экранов')
      document.querySelector('#stack').innerHTML = project.stack.map(item => `<li class="chip">${escapeHtml(item)}</li>`).join('')

      const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>'

      const isService = page => screenType(page) === 'Служебная'
      document.querySelector('#screens').innerHTML = [...pages.filter(page => !isService(page)), ...pages.filter(isService)]
        .map(page => `<a class="cell" href="${href(page)}" target="_blank" rel="noopener"><span>${escapeHtml(label(page))}</span>${arrow}</a>`)
        .join('')

      const switchRoot = document.querySelector('#switch')
      const switchButton = document.querySelector('#switchButton')
      document.querySelector('#switchLabel').textContent = project.title
      document.querySelector('#switchList').innerHTML = PROJECT_ORDER
        .map(key => `<a href="project.html?project=${key}"${key === projectKey ? ' aria-current="page"' : ''}>${escapeHtml(PROJECTS[key].title)}</a>`)
        .join('')

      const setOpen = open => {
        switchRoot.classList.toggle('is-open', open)
        switchButton.setAttribute('aria-expanded', String(open))
      }
      switchButton.addEventListener('click', () => setOpen(!switchRoot.classList.contains('is-open')))
      document.addEventListener('click', event => {
        if (!switchRoot.contains(event.target)) setOpen(false)
      })
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') setOpen(false)
      })

      function plural(n, one, few, many) {
        const mod10 = n % 10
        const mod100 = n % 100
        if (mod10 === 1 && mod100 !== 11) return one
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few
        return many
      }

      function href(page) {
        return `projects/${projectKey}/${page}`
      }

      function label(page) {
        if (PROJECT_LABELS[projectKey]?.[page]) return PROJECT_LABELS[projectKey][page]
        if (LABELS[page]) return LABELS[page]
        return fallbackLabel(page)
      }

      function fallbackLabel(page) {
        const name = page.replace('.html', '')
        const variant = name.match(/^(.*)-(\d+)$/)
        const base = variant ? variant[1] : name
        const title = base
          .split('-')
          .map(part => {
            const dict = {
              account: 'кабинет',
              authors: 'авторы',
              author: 'автор',
              basket: 'корзина',
              blog: 'блог',
              card: 'карточка',
              catalog: 'каталог',
              collection: 'коллекция',
              contacts: 'контакты',
              details: 'детали',
              empty: 'пусто',
              event: 'событие',
              events: 'события',
              favourites: 'избранное',
              form: 'форма',
              history: 'история',
              item: 'карточка товара',
              list: 'список',
              login: 'вход',
              media: 'медиа',
              order: 'заказ',
              orders: 'заказы',
              payment: 'оплата',
              product: 'продукт',
              products: 'продукты',
              project: 'проект',
              projects: 'проекты',
              reg: 'регистрация',
              search: 'поиск',
              service: 'услуга',
              services: 'услуги',
              settings: 'настройки',
              wishlist: 'избранное',
              works: 'работы'
            }
            return dict[part] || part
          })
          .join(' ')
          .replace(/^./, char => char.toUpperCase())

        return variant ? `${title}: вариант ${variant[2]}` : title
      }

      function screenType(page) {
        const name = page.replace('.html', '')
        if (name === 'index' || name.startsWith('index-')) return 'Витрина'
        if (/(catalog|collection|products|shop|rooms|services|specials|universe|works|artists|studio|mood)/.test(name)) return 'Каталог / раздел'
        if (/(product|card|item|obj|project)/.test(name)) return 'Карточка / детальная'
        if (/(cart|basket|bag|order|payment|delivery|buy|refund|details)/.test(name)) return 'Покупка / заказ'
        if (/(account|lk|login|reg|wishlist|favourites)/.test(name)) return 'Кабинет / авторизация'
        if (/(case|blog|article|event|author|media|history|podcast|press|news|sale|review|ambassodor)/.test(name)) return 'Контент'
        if (/(form|contacts|vacancy|tender|offices|specialists)/.test(name)) return 'Форма / контакты'
        if (/(policy|privacy|text|404|error)/.test(name)) return 'Служебная'
        return 'Экран'
      }

      function escapeHtml(value) {
        return value.replace(/[&<>"']/g, char => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[char])
      }
    </script>
  </body>
</html>
